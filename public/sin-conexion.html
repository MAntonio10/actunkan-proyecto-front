<!doctype html>
<!--
  Último recurso del Service Worker: una ruta que no quedó precacheada y a la
  que se navega sin señal. Es HTML plano y autocontenido a propósito — si
  dependiera de la aplicación, fallaría exactamente cuando hace falta.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Parque Actún Kan</title>
    <style>
      :root {
        --fondo: #f5f1e6;
        --tarjeta: #ffffff;
        --texto: #23301f;
        --suave: #5f6b59;
        --verde: #5a8557;
        --borde: #dcd6c4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #1a1f18;
          --tarjeta: #232a21;
          --texto: #eaf0e6;
          --suave: #a3b09c;
          --borde: #38402f;
        }
        /* El dibujo es beige claro: sobre el tema oscuro solo abriria un hueco.
           Se califica con `html` porque la regla de `body` viene despues y, a
           igual especificidad, ganaria la ultima. */
        html body { background-image: none; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        /* Mismo fondo que el resto del sistema. La imagen la precachea el
           Service Worker junto a esta pagina, asi que tambien se ve sin senal;
           el color plano queda debajo por si no llego a guardarse. */
        background-color: var(--fondo);
        background-image:
          linear-gradient(180deg, rgb(245 241 230 / 45%), rgb(245 241 230 / 45%)),
          url("/fondo-sistema-1920.webp");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: var(--texto);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .tarjeta {
        background: var(--tarjeta);
        border: 1px solid var(--borde);
        border-radius: 1rem;
        padding: 2rem 1.75rem;
        max-width: 26rem;
        width: 100%;
        text-align: center;
        box-shadow: 0 6px 24px rgb(0 0 0 / 8%);
      }
      .logos { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.25rem; }
      .logos img { height: 52px; width: auto; }
      h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; line-height: 1.55; color: var(--suave); margin: 0 0 1.25rem; }
      .acciones { display: flex; flex-direction: column; gap: 0.6rem; }
      a, button {
        display: block;
        width: 100%;
        padding: 0.7rem 1rem;
        border-radius: 0.6rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid var(--borde);
        background: transparent;
        color: var(--texto);
        font-family: inherit;
      }
      a.primario { background: var(--verde); border-color: var(--verde); color: #fff; }
    </style>
  </head>
  <body>
    <main class="tarjeta">
      <div class="logos">
        <img src="/Propeten.png" alt="ProPetén" />
        <img src="/actun.png" alt="Parque Regional Municipal Actún Kan" />
      </div>

      <h1>Esta pantalla necesita conexión</h1>
      <p>
        No hay internet y este módulo no está guardado en el dispositivo.
        La emisión de tickets sí funciona sin conexión: las ventas quedan
        guardadas y se suben solas al recuperar la señal.
      </p>

      <div class="acciones">
        <a class="primario" href="/registro-visitantes">Ir a emisión de tickets</a>
        <a href="/validar-ticket">Validar un pase</a>
        <button type="button" onclick="location.reload()">Reintentar</button>
      </div>
    </main>
  </body>
</html>
